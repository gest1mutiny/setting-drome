name: 📡 Headless SRT Master Core

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

permissions:
  contents: write
  actions: write

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Inicializando espacio en el disco virtual de Microsoft
        uses: actions/checkout@v4

      # Instalamos el servidor gráfico fantasma Xvfb y las herramientas nativas puras
      - name: ⚙️ Instalando Servidor Gráfico Virtual y Codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg fonts-dejavu-core curl jq alsa-utils

      - name: 🚀 Emisión Satelital Continua Inmune por Captura de Monitor Invisible
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v920 - HEADLESS DISPLAY DIEGO FIX]
          export TERM=xterm
          
          echo "🍿 Mutiny TV - Transmisión Soberana en Vivo" > abajo.txt
          
          URL_GIST_PLAYLIST="https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/playlist.txt"
          
          echo "📡 [MUTINY TV] INICIALIZANDO MONITOR FANTASMA EN LA RAM VIRTUAL..."
          # 1. Creamos la pantalla invisible de 1280x720 a 24 bits de color en el display :99
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 2

          echo "📡 [MUTINY TV] SUCCIONANDO PLAYLIST REMOTA DESDE EL GIST..."
          curl -L -s "$URL_GIST_PLAYLIST" | tr -d '\r' | sed '/^$/d' > grilla_remota.txt

          # Fabricamos la lista local limpia de fideos descargados a 108 MB/s satelitales
          echo "# Lista local para el bucle de ffplay" > playlist_local.txt
          contador=1
          
          while read -r linea || [ -n "$linea" ]; do
            URL_INTERNET=$(echo "$linea" | awk -F'|' '{print $1}' | tr -d ' ')
            if [ -n "$URL_INTERNET" ]; then
              echo "📥 Pre-descargando Tramo $contador al disco rígido virtual: $URL_INTERNET"
              curl -L -H "Authorization: token ${{ secrets.TOKEN_B }}" \
                   -H "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
                   -o "fideo_${contador}.mp4" "$URL_INTERNET"
              
              echo "fideo_${contador}.mp4" >> playlist_local.txt
              contador=$((contador + 1))
            fi
          done < grilla_remota.txt

          echo "🪓 [MUTINY] DETECTANDO PRIMER TÍTULO DE LA MARATÓN..."
          PRIMERA_LINEA=$(head -n 1 grilla_remota.txt)
          TITULO_INICIAL=$(echo "$PRIMERA_LINEA" | awk -F'|' '{print $2}' | sed 's/^[ \t]*//;s/[ \t]*$//')
          echo "${TITULO_INICIAL:-🍿 Mutiny TV - Cine Continuo}" > abajo.txt

          echo "🪓 [MUTINY] ENCIENDIENDO REPRODUCTOR INMUNE EN EL MONITOR VIRTUAL..."
          # 🧠 JUGADA MAESTRA v920: El bucle corre por dentro de la pantalla invisible.
          # Ejecuta ffplay forzando strictly el escalado a 1280x720 ocupando toda la pantalla de Kick sin deformarse.
          # Al terminar el video 1, salta al video 2 adentro de la lona en frío sin apagar el x11grab.
          # Usamos -an para evitar trabas y dejamos que ffmpeg maneje el audio unificado.
          while true; do
            while read -r pelicula_local || [ -n "$pelicula_local" ]; do
              if [[ "$pelicula_local" != "#"* ]] && [ -f "$pelicula_local" ]; then
                 echo "🎬 Dibujando a pantalla completa real en la RAM: $pelicula_local"
                 ffplay -v quiet -an -fs -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" -autoexit "$pelicula_local"
                 sleep 1
              fi
            done < playlist_local.txt
            echo "🔄 Fin de la tanda local. Pegando la vuelta en background..."
          done &
          sleep 3

          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN SRT POR CAPTURA..."
          
          # 🧠 JUGADA FINAL DIEGO CHESSMASTER:
          # Capturamos el monitor virtual :99.0 entero que nunca se apaga (inmune a caídas entre videos).
          # Le acoplamos una pista de audio digital unificada limpia para que el SRT de Kick no se congele.
          # Le pegamos tu drawtext verde Mutiny goteando las noticias abajo de forma nativa.
          ffmpeg -y -f x11grab -video_size 1280x720 -i :99.0 \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -vf "drawtext=textfile=abajo.txt:reload=1:x=30:y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4" \
            -map 0:v -map 1:a -r 30 -g 60 -keyint_min 60 -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 12000k \
            -c:a aac -b:a 128k -f mpegts "srt://fa723fc1b171.srt.live-video.net:9000?streamid=sk_us-west-2_MqGIuZCjdkwn_W8taony5k1gvPaCz1F7MWd2Rd0QAvb&passphrase=vrdzu5pih7bmRaVralELJ2wlBzrQPgsp08kGoZmPTKkqlkbN8CPzuUEYUtJU5ivRJE6nBqIOGPr2V1Q" || true

          echo "🏁 La maratón en el monitor virtual ha finalizado. Satélite de test apagado."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

         
