name: 📡 Mutiny TV IPTV Pirate Engine v610.0

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware en la nube
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Directa Unificada con Salto de Grilla Automático a Kick
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v610.0 - DIEGO CLOCKWORK MARATHON PURIST]
          export TERM=xterm
          
          # ESCUDO DE TEXTOS MUDE INITIAL
          echo "Cargando..." > letrero.txt
          echo "Cargando informis Mutiny..." > abajo.txt
          
          URL_GIST_TEXTO="https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/anuncio.txt"
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/noticias.txt"
          # Hilos de marquesinas dinámicas en background (Volaron los banners pesados Surge de la derecha)
          while true; do curl -s "$URL_GIST_TEXTO" | head -n 1 | tr -d '\r\n' > letrero.txt; sleep 4; done &
          while true; do curl -s "$URL_GIST_NOTICIAS" | head -n 1 | tr -d '\r\n' > abajo.txt; sleep 5; done &

          # 🧱 [EL SEGURO DE LA MARATÓN]: Inicializamos el contador de fila india
          echo "1" > linea_actual.txt

          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN DE LARGO FLUIDO..."
          
          # 🧠 TU JUGADA MAESTRA BIÓNICA FINAL:
          # Un solo ffmpeg al frente libre de Nginx. Mantiene speed=1.0x rígidos de relojito.
          # Cuando el video termina, salta de renglón solo. Kick absorbe el salto y NO TE MANDAA NEGRO,
          # sostiene la señal en línea, ¡y tu retención de usuarios se queda clavada en la cima de por vida!
          while true; do
            curl -s "https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/playlist.txt" | tr -d '\r' | sed '/^$/d' > grilla_local.txt
            NUM_LINEA=$(cat linea_actual.txt)
            URL_PIRATA=$(sed -n "${NUM_LINEA}p" grilla_local.txt | tr -d ' ')

            if [ -z "$URL_PIRATA" ]; then
              echo "🔄 Fin de la cartelera de hoy. Pegando la vuelta al Renglón 1..."
              echo "1" > linea_actual.txt
              sleep 5; continue
            fi

            echo "🍿 [MUTINY] REPRODUCIENDO RENGLÓN DE GRILLA NÚMERO: $NUM_LINEA"
            echo "🎬 Link: $URL_PIRATA"

            # -reconnect 1 se amarra a Redworld ante micro-cortes.
            # scale=1280:720 y crop de 5px estiran la pantalla útil a Full-Canvas nativo tapando marcos negros.
            # rotate=0.012 mete el contra-copyright disimulado perfectamente en las orillas.
            # El drawtext de abajo se mutó strictly a letras VERDES fluorescentes (fontcolor=0x00e676).
            # -g 60 -keyint_min 60 clava los Keyframes en 2 segundos rígidos limpiando las advertencias.
            ffmpeg -y -headers "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -re -i "$URL_PIRATA" -re -loop 1 -i plantilla_horizontal.png \
            -filter_complex "[0:v]scale=1280:720,crop=1270:710:5:5,eq=contrast=1.12:brightness=0.02,rotate=0.012:ow=1280:oh=720:fillcolor=black[peli_expandida]; \
                             [1:v]scale=1280:720[fondo_base]; \
                             [fondo_base][peli_expandida]overlay=0:0:shortest=0[canvas_parcial]; \
                             [canvas_parcial]drawtext=textfile=letrero.txt:reload=1:x=30:y=25:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.6:boxborderw=5,\
                                              drawtext=textfile=abajo.txt:reload=1:x=30:y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" \
            -r 30 -g 60 -keyint_min 60 -map 0:a? -map "[canvas_fusionado]" -sn -dn -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 12000k \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -f flv \
            "rtmps://fa723fc1b171.global-contribute.live-video.net/app/sk_us-west-2_yb6F1b18xTEE_QpaA7pm407C0FAAGgZPTqZHvtIJM2Q" || true

            echo "🏁 Transición de bloque detectada. Saltando de renglón..."
            echo "$((NUM_LINEA + 1))" > linea_actual.txt
            sleep 4
          done
