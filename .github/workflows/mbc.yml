name: 📡 Mutiny TV IPTV Pirate Engine v617.5 - Release Core

on:
  workflow_dispatch: # Botón manual de PLAY en la web de GitHub

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware en la nube
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Emisión Directa Unificada hacia Kick Inmune a Caídas de Audio
        run: |
          # 🪓 [REACTOR CENTRAL INDUSTRIAL v617.5 - DIEGO S_YNC GIST CORE]
          export TERM=xterm
          
          # ESCUDO DE TEXTOS MUDO INICIAL
          echo "Sintonizando señal..." > letrero.txt
          echo "Cargando informes Mutiny TV..." > abajo.txt
          
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/noticias.txt"
          
          # Hilo de marquesina inferior de noticias en background
          while true; do curl -s "$URL_GIST_NOTICIAS" | head -n 1 | tr -d '\r\n' > abajo.txt; sleep 5; done &

          # 🧱 [EL SEGURO DE LA MARATÓN]: Inicializamos el contador de fila india
          echo "1" > linea_actual.txt

          echo "📡 [MUTINY TV] ENCIENDIENDO CAÑO MAESTRO DE EMISIÓN DE LARGO FLUIDO..."
          
          while true; do
            # Sincronizamos la grilla local desde tu playlist del Gist privado
            curl -s "https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/playlist.txt" | tr -d '\r' | sed '/^$/d' > grilla_local.txt
            NUM_LINEA=$(cat linea_actual.txt)
            
            # Extraemos la línea cruda deboxes (URL | TÍTULO | IMAGEN)
            LINEA_COMPLETA=$(sed -n "${NUM_LINEA}p" grilla_local.txt)

            if [ -z "$LINEA_COMPLETA" ]; then
              echo "🔄 Fin de la cartelera de hoy. Pegando la vuelta al Renglón 1..."
              echo "1" > linea_actual.txt
              sleep 5; continue
            fi

            # 🧠 LA MAGIA DE LA DISECCIÓN MOLECULAR EN LA RAM DESDE EL GIST
            # Cortamos el renglón usando la tubería '|' como aduana estricta
            URL_PIRATA=$(echo "$LINEA_COMPLETA" | cut -d'|' -f1 | tr -d ' ')
            TITULO_PELI=$(echo "$LINEA_COMPLETA" | cut -d'|' -f2 | sed 's/^[ \t]*//;s/[ \t]*$//')

            # Clavamos el título de la película limpio directamente en el archivo letrero.txt en caliente
            echo "$TITULO_PELI" > letrero.txt

            echo "🍿 [MUTINY] REPRODUCIENDO RENGLÓN DE GRILLA NÚMERO: $NUM_LINEA"
            echo "🎬 Título: $TITULO_PELI"
            echo "🔗 Link: $URL_PIRATA"

            # 🪓 [REACTOR MAESTRO LÍQUIDO v617.5 - DIEGO INFINITE STREAM CORE]
            # Mantiene tu pasaporte TOKEN_B y tu plantilla_horizontal.png en bucle eterno (-loop 1)
            # para que Kick jamás detecte un microcorte entre videos y la señal fluya continuously en HD.
            # 🪓 [REACTOR MAESTRO LÍQUIDO v617.6 - EXTIRPADO EL TIMEOUT PARÁSITO]
            # Limpiamos el timeout de raíz para evitar que el capítulo se corte en la mitad de la noche.
            # Mantiene las reconexiones de acero de 15 segundos máximos para blindar el vivo continuously.
            # 🪓 [REACTOR CENTRAL INDUSTRIAL v617.7 - DIEGO LIQUID S_YNC RECTIFIED]
            # Ponemos los -headers strictly adelante de la URL de internet ($URL_PIRATA) para que no choque contra la imagen local.
            # Ordenamos los mapas [0:v] y [1:v] para que la plantilla sostenga el vivo sin microcortes de piloto automático real.
            ffmpeg -y -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 15 \
            -fflags +genpts+igndts+flush_packets+discardcorrupt+nofillin \
            -loop 1 -i plantilla_horizontal.png \
            -headers "Authorization: token ${{ secrets.TOKEN_B }}\r\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -re -async 1 -i "$URL_PIRATA" \
            -filter_complex "[0:v]scale=1280:720[fondo_infinito]; \
                             [1:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,eq=contrast=1.12:brightness=0.02,rotate=0.012:ow=1280:oh=720:fillcolor=black[peli_proporcional]; \
                             [fondo_infinito][peli_proporcional]overlay=0:0:shortest=1[canvas_parcial]; \
                             [canvas_parcial]drawtext=textfile=letrero.txt:reload=1:x=30:y=25:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.6:boxborderw=5,\
                                              drawtext=textfile=abajo.txt:reload=1:x=30:y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" \
            -r 30 -g 60 -keyint_min 60 -map 1:a? -map "[canvas_fusionado]" -sn -dn -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 12000k \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -af aresample=async=1 -f flv \
            "rtmps://fa723fc1b171.global-contribute.live-video.net/app/sk_us-west-2_yb6F1b18xTEE_QpaA7pm407C0FAAGgZPTqZHvtIJM2Q" || true

            echo "🏁 Transición de bloque detectada. Saltando de renglón..."
            echo "$((NUM_LINEA + 1))" > linea_actual.txt
            sleep 3
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          
     
