name: 📡 Mutiny TV - Nodo Cocina v1.0

on:
  workflow_dispatch:

jobs:
  processing:
    runs-on: ubuntu-latest
    steps:
      - name: 🗄️ Clonando el búnker de archivos estáticos
        uses: actions/checkout@v4

      - name: ⚙️ Instalando FFmpeg nativo por hardware
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core curl jq

      - name: 🚀 Cocinando el Video Útil y Eyectando al Satélite
        run: |
          export TERM=xterm
          echo "Cargando..." > letrero.txt
          echo "Cargando informis Mutiny..." > abajo.txt
          
          # Hilos de marquesinas dinámicas en background
          URL_GIST_TEXTO="https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/anuncio.txt"
          URL_GIST_NOTICIAS="https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/noticias.txt"

          while true; do curl -s "$URL_GIST_TEXTO" | head -n 1 | tr -d '\r\n' > letrero.txt; sleep 4; done &
          while true; do curl -s "$URL_GIST_NOTICIAS" | head -n 1 | tr -d '\r\n' > abajo.txt; sleep 5; done &

          # Bucle infinito que lee la playlist y salta de capítulo solo en background sin apagar el satélite
          while true; do
            curl -s "https://gist.githubusercontent.com/jav45dev-ctrl/c02c7fac36fde342f061b733231a5e6d/raw/playlist.txt" | tr -d '\r' | sed '/^$/d' > grilla_local.txt
            URL_PIRATA=$(sed -n "1p" grilla_local.txt | tr -d ' ')

            # 🪓 RE ENLACE DIRECTO: Mandamos el video unificado procesado hacia la Cuenta B de GitHub.
            # Cambiá strictly la muga de "IP_DE_LA_CUENTA_B" por el túnel que nos dé el segundo robot mañana.
            ffmpeg -y -headers "User-Agent: VLC/3.0.18 LibVLC/3.0.18" \
            -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -re -i "$URL_PIRATA" -re -loop 1 -i plantilla_horizontal.png \
            -filter_complex "[0:v]scale=1280:720,crop=1270:710:5:5,eq=contrast=1.12:brightness=0.02[peli_expandida]; \
                             [1:v]scale=1280:720[fondo_base]; \
                             [fondo_base][peli_expandida]overlay=0:0:shortest=0[canvas_parcial]; \
                             [canvas_parcial]drawtext=textfile=letrero.txt:reload=1:x=30:y=25:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.6:boxborderw=5,\
                                              drawtext=textfile=abajo.txt:reload=1:x=30:y=665:fontsize=24:fontcolor=0x00e676:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:box=1:boxcolor=black@0.5:boxborderw=4[canvas_fusionado]" \
            -r 30 -g 60 -keyint_min 60 -map 0:a? -map "[canvas_fusionado]" -sn -dn -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 12000k \
            -c:a aac -b:a 128k -ac 2 -ar 44100 -f flv rtmp://admin.localhost.run/vivo/stream_diego || true
            sleep 4
          done
